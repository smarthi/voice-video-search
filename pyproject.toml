[project]
name = "video-voice-search"
version = "0.1.0"
description = "CPU-only, offline voice-queried video frame retrieval demo"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.14.0",
    "av>=14.0.0",
    "einops>=0.8.0",
    "faster-whisper>=1.1.1",
    "gradio>=5.29.0",
    "imageio-ffmpeg>=0.5.1",
    "numpy>=2.2.0",
    "open-clip-torch>=2.32.0",
    "opencv-python-headless>=4.5.1.48",
    "opensearch-py>=2.6.0",
    "pillow>=11.1.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.8.0",
    "qwen-vl-utils>=0.0.14",
    "rapidocr-onnxruntime>=1.4.4",
    "sentence-transformers>=4.1.0",
    "torch>=2.6.0",
    "torchvision>=0.21.0",
    "yt-dlp>=2025.3.31",
]

[project.optional-dependencies]
dev = ["ruff>=0.11.0"]

[project.scripts]
vvs = "vvs.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vvs"]

[tool.hatch.build.targets.wheel.force-include]
"src/vvs/ui/theme.css" = "vvs/ui/theme.css"

[tool.uv]
package = true

# rapidocr-onnxruntime asks for full opencv-python, which bundles libavdevice.
# PyAV bundles its own, and on macOS both register the AVFoundation Objective-C
# classes (AVFFrameReceiver, AVFAudioReceiver) into one process. The ObjC runtime
# warns that this "may cause spurious casting failures and mysterious crashes",
# and it does. The headless wheel ships libavcodec and libavformat but no
# libavdevice, so the duplicate classes disappear. Nothing here opens an OpenCV
# window, so headless costs us nothing; RapidOCR only uses cv2 for array work.
override-dependencies = ["opencv-python; sys_platform == 'never'"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
# Linux takes the CUDA build, macOS the plain one.
#
# macOS keeps its Metal backend either way: "cpu" names only the non-CUDA
# variant, and the macOS arm64 wheels that index serves are the same ones PyPI
# has, mps included. There are no CUDA wheels for macOS to want.
#
# Linux used to take the cpu index too, to avoid pulling ~2 GB of CUDA. That
# was wrong here: the Linux box has an RTX PRO 2000 (Blackwell, sm_120), and
# the pin left it idle while the 2B visual encoder ran at ~50 s/frame on the
# CPU. cu130 because sm_120 needs CUDA 12.8 or newer, torch 2.13 publishes no
# cu128 wheels, and the driver reports 13.2. Verify after changing this:
# torch.cuda.is_available() must be True and get_device_capability() (12, 0).
torch = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux'" },
  { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
]
torchvision = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux'" },
  { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
]
