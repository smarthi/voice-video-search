services:
  opensearch:
    # Fully qualified on purpose: podman has no implicit docker.io, so a bare
    # `opensearchproject/...` fails to resolve there. Docker accepts this form
    # unchanged, so the file runs under either runtime.
    image: docker.io/opensearchproject/opensearch:2.19.1
    container_name: vvs-opensearch
    # Without this a reboot leaves the container in Created and the app cannot
    # reach :9200. `always` rather than the more usual `unless-stopped`: under
    # rootless podman the policy does nothing on its own, it is acted on by
    # podman-restart.service, and that unit runs
    # `podman start --all --filter restart-policy=always` -- which
    # unless-stopped does not match, so it would be silently ignored at boot.
    # The unit also has to be enabled for the user and needs lingering on to
    # run at boot at all. See the README.
    restart: always
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - bootstrap.memory_lock=true
      # Only used to satisfy the security plugin's startup check; the plugin
      # itself is disabled above, so nothing actually authenticates with this.
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=Vvs!DevOnly1
      # Single-node dev instance holding a few hundred to a few thousand
      # vectors (see retrieve/opensearch_store.py) -- 512m is generous, not a
      # sizing recommendation for the on-prem design in
      # docs/CONFLUENCE_ONPREM.md.
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    ulimits:
      # Honoured under Docker and rootful podman. Rootless podman silently
      # caps this at the invoking user's hard limit (64 MB here) rather than
      # erroring, so OpenSearch logs "Unable to lock JVM Memory" and
      # "memory locking requested ... but memory is not locked" and then
      # starts anyway -- single-node does not enforce that bootstrap check.
      # Harmless for a dev node; set bootstrap.memory_lock=false above to
      # silence it.
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - vvs-opensearch-data:/usr/share/opensearch/data

  # Both behind the "services" profile: `docker compose up -d` (no profile)
  # starts only OpenSearch, exactly as before this existed. Bring these up
  # with `docker compose --profile services up -d` once you actually want to
  # run the visual encoder and captioner as their own deployments instead of
  # in-process -- see README.md's Embedding services section. Linux/CUDA (or
  # CPU) only; Metal does not pass through Docker, so run these two directly
  # on macOS instead (`uv run --extra services uvicorn ...`) to use Apple
  # Silicon's GPU.
  visual-embed:
    profiles: ["services"]
    build:
      context: .
      dockerfile: docker/visual-embed.Dockerfile
    container_name: vvs-visual-embed
    ports:
      - "8001:8001"
    volumes:
      - vvs-hf-cache:/root/.cache/huggingface
    # deploy.resources.reservations.devices needs the NVIDIA Container
    # Toolkit on the host; uncomment on a CUDA box, leave commented for a
    # CPU-only run (slow, but correct).
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  caption:
    profiles: ["services"]
    build:
      context: .
      dockerfile: docker/caption.Dockerfile
    container_name: vvs-caption
    ports:
      - "8002:8002"
    volumes:
      - vvs-hf-cache:/root/.cache/huggingface
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  vvs-opensearch-data:
  # Shared by both services -- HF's cache is keyed by model id, so sharing it
  # just means one download instead of two on first run, not a conflict.
  vvs-hf-cache:
